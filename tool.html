function lerpColor(a, b, t) {
  const pa = a.match(/\w\w/g).map((h) => parseInt(h, 16));
  const pb = b.match(/\w\w/g).map((h) => parseInt(h, 16));
  const p = pa.map((v, i) => Math.round(v + (pb[i] - v) * t));
  return `rgb(${p[0]},${p[1]},${p[2]})`;
}

function fmtNum(v) {
  if (v === null || v === undefined || Number.isNaN(v)) return "–";
  if (typeof v !== "number") return String(v);
  if (Math.abs(v) >= 1000) return v.toLocaleString(undefined, { maximumFractionDigits: 0 });
  if (Number.isInteger(v)) return String(v);
  return v.toLocaleString(undefined, { maximumFractionDigits: 3 });
}

// Short number format for chart labels only: values of a million or more become 1.63M, 2.4B, 1.63T.
// Smaller values are shown in full. Tables, hover boxes and Excel files keep the exact numbers.
function fmtShort(v) {
  if (typeof v !== "number" || !Number.isFinite(v)) return fmtNum(v);
  const units = [[1e6, "M"], [1e9, "B"], [1e12, "T"]];
  if (Math.abs(v) < 1e6) return fmtNum(v);
  for (let i = 0; i < units.length; i++) {
    const [d, u] = units[i];
    const shown = parseFloat((v / d).toPrecision(3));
    if (Math.abs(shown) < 1000 || i === units.length - 1) return shown.toLocaleString(undefined, { maximumFractionDigits: 2 }) + u;
  }
  return fmtNum(v);
}

// Wraps a label into up to 2 lines of roughly maxCharsPerLine each, truncating with an ellipsis beyond that
function wrapTwoLines(text, maxCharsPerLine) {
  if (text.length <= maxCharsPerLine) return [text];
  const words = text.split(" ");
  let line1 = "", line2 = "";
  for (const w of words) {
    const tryLine1 = (line1 + " " + w).trim();
    const tryLine2 = (line2 + " " + w).trim();
    if (!line2 && tryLine1.length <= maxCharsPerLine) {
      line1 = tryLine1;
    } else if (tryLine2.length <= maxCharsPerLine) {
      line2 = tryLine2;
    } else {
      line2 = tryLine2;
      break;
    }
  }
  if (!line1) { line1 = text.slice(0, maxCharsPerLine); line2 = text.slice(maxCharsPerLine); }
  if (line2.length > maxCharsPerLine) line2 = line2.slice(0, maxCharsPerLine - 1) + "…";
  return line2 ? [line1, line2] : [line1];
}

function niceNumber(range, round) {
  if (range === 0) return 1;
  const exponent = Math.floor(Math.log10(range));
  const fraction = range / Math.pow(10, exponent);
  let niceFraction;
  if (round) {
    if (fraction < 1.5) niceFraction = 1;
    else if (fraction < 3) niceFraction = 2;
    else if (fraction < 7) niceFraction = 5;
    else niceFraction = 10;
  } else {
    if (fraction <= 1) niceFraction = 1;
    else if (fraction <= 2) niceFraction = 2;
    else if (fraction <= 5) niceFraction = 5;
    else niceFraction = 10;
  }
  return niceFraction * Math.pow(10, exponent);
}

// Produces "nice" round ticks that tightly cover the data range (won't overshoot far past the real max/min)
function niceTicksN(dataMin, dataMax, targetCount) {
  if (dataMin === dataMax) { dataMin -= 1; dataMax += 1; }
  targetCount = Math.max(2, Math.round(targetCount));
  const range = niceNumber(dataMax - dataMin, false);
  const step = niceNumber(range / (targetCount - 1), true);
  const niceMin = Math.floor(dataMin / step) * step;
  const niceMax = Math.ceil(dataMax / step) * step;
  const ticks = [];
  for (let v = niceMin; v <= niceMax + step * 0.5; v += step) {
    ticks.push(Math.round((v + Number.EPSILON) * 1e9) / 1e9);
  }
  return { min: niceMin, max: niceMax, step, ticks };
}

// ---------- Chart downloads (PNG / SVG) ----------
// Charts are saved 6.5 inches wide: the text width of a letter-size page with 1-inch margins.
// 6.5 in x 96 px per inch = 624 px; the chart itself is drawn 600 px wide with a 12 px white margin.
const EXPORT_W = 600;
const EXPORT_PAD = 12;
const EXPORT_PNG_SCALE = 3; // 3x pixels = about 300 pixels per inch when printed at 6.5 in

const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
    t[n] = c >>> 0;
  }
  return t;
})();
function crc32(bytes) {
  let c = 0xffffffff;
  for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xff] ^ (c >>> 8);
  return (c ^ 0xffffffff) >>> 0;
}
// Writes the resolution into the PNG (a "pHYs" block) so programs like Word place it at the intended size
async function setPngDpi(blob, dpi) {
  const buf = new Uint8Array(await blob.arrayBuffer());
  const ppm = Math.round(dpi / 0.0254);
  const chunk = new Uint8Array(21);
  const dv = new DataView(chunk.buffer);
  dv.setUint32(0, 9);
  chunk.set([0x70, 0x48, 0x59, 0x73], 4); // "pHYs"
  dv.setUint32(8, ppm);
  dv.setUint32(12, ppm);
  chunk[16] = 1; // unit: meters
  dv.setUint32(17, crc32(chunk.subarray(4, 17)));
  const insertAt = 33; // right after the PNG signature (8 bytes) and the IHDR block (25 bytes)
  const out = new Uint8Array(buf.length + 21);
  out.set(buf.subarray(0, insertAt), 0);
  out.set(chunk, insertAt);
  out.set(buf.subarray(insertAt), insertAt + 21);
  return new Blob([out], { type: "image/png" });
}

// The chart font (Cascadia Code) comes from Google Fonts. An SVG drawn into a PNG can't download fonts,
// so for PNGs the font file is embedded inside the picture. If that fails, the PNG uses a similar font.
let fontCssPromise = null;
function getEmbeddedFontCss() {
  if (!fontCssPromise) {
    fontCssPromise = (async () => {
      try {
        const cssText = await (await fetch("https://fonts.googleapis.com/css2?family=Cascadia+Code:wght@400;600;700&display=swap")).text();
        const blocks = cssText.match(/@font-face\s*{[^}]*}/g) || [];
        const latin = blocks.filter((b) => /unicode-range:[^;]*U\+0000-00FF/i.test(b));
        const out = [];
        for (const b of latin) {
          const m = b.match(/url\((['"]?)([^'")]+)\1\)/);
          if (!m) continue;
          const fontBlob = await (await fetch(m[2])).blob();
          const dataUrl = await new Promise((res, rej) => {
            const r = new FileReader();
            r.onload = () => res(r.result);
            r.onerror = rej;
            r.readAsDataURL(fontBlob);
          });
          out.push(b.replace(m[0], `url(${dataUrl})`));
        }
        return out.join("\n");
      } catch (e) {
        return "";
      }
    })();
  }
  return fontCssPromise;
}

function slugify(text) {
  return String(text || "chart").replace(/[^A-Za-z0-9_\-]+/g, "_").replace(/^_+|_+$/g, "").slice(0, 80) || "chart";
}

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

// Height taken by the title and legend at the top of a downloaded chart (same layout as buildExportSvg)
function exportHeaderHeight(meta, totalW) {
  let y = 0;
  if (meta && meta.title) y += 24;
  if (meta && meta.legend && meta.legend.length) {
    let x = EXPORT_PAD;
    meta.legend.forEach((item) => {
      const colors = item.colors || [item.color];
      const w = colors.length * 13 + 4 + item.label.length * 6.2 + 16;
      if (x + w > totalW - EXPORT_PAD && x > EXPORT_PAD) { x = EXPORT_PAD; y += 18; }
      x += w;
    });
    y += 18 + 6;
  }
  return y;
}

// Download size from inches: the whole image (chart, title, legend and white margin) is exactly widthIn x heightIn.
// heightIn is optional; without it the chart keeps its on-screen height.
function exportSize(meta, widthIn, heightIn) {
  const totalW = Math.round(widthIn * 96);
  const out = { ...meta, chartW: totalW - EXPORT_PAD * 2 };
  if (heightIn) {
    out.totalPx = Math.round(heightIn * 96);
    out.chartH = Math.max(80, out.totalPx - EXPORT_PAD * 2 - exportHeaderHeight(meta, totalW));
  }
  return out;
}

// Builds a standalone SVG (white background, optional title and legend) around a chart's SVG element
function buildExportSvg(svgEl, meta, fontCss) {
  const NS = "http://www.w3.org/2000/svg";
  const SANS = "-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif";
  const vb = svgEl.viewBox && svgEl.viewBox.baseVal && svgEl.viewBox.baseVal.width ? svgEl.viewBox.baseVal : { width: svgEl.clientWidth, height: svgEl.clientHeight };
  let bbox = { x: 0, y: 0, width: vb.width, height: vb.height };
  try { bbox = svgEl.getBBox(); } catch (e) {}
  // Include anything drawn slightly outside the chart's box (e.g. axis labels)
  const minX = Math.min(0, bbox.x), minY = Math.min(0, bbox.y);
  const maxX = Math.max(vb.width, bbox.x + bbox.width), maxY = Math.max(vb.height, bbox.y + bbox.height);
  const cw = maxX - minX, ch = maxY - minY;
  const EW = (meta && meta.chartW) || EXPORT_W; // chart width for this download (6.5 in by default)
  let scale = Math.min(1, EW / cw);
  const totalW = EW + EXPORT_PAD * 2;

  const root = document.createElementNS(NS, "svg");
  root.setAttribute("xmlns", NS);
  root.setAttribute("font-family", SANS);
  if (fontCss) {
    const defs = document.createElementNS(NS, "defs");
    const style = document.createElementNS(NS, "style");
    style.textContent = fontCss;
    defs.appendChild(style);
    root.appendChild(defs);
  }
  const bg = document.createElementNS(NS, "rect");
  bg.setAttribute("x", 0); bg.setAttribute("y", 0); bg.setAttribute("width", totalW); bg.setAttribute("fill", "#FFFFFF");
  root.appendChild(bg);

  let y = EXPORT_PAD;
  if (meta && meta.title) {
    const t = document.createElementNS(NS, "text");
    t.setAttribute("x", EXPORT_PAD); t.setAttribute("y", y + 13);
    t.setAttribute("font-size", "13"); t.setAttribute("font-weight", "700"); t.setAttribute("fill", "#111111");
    t.textContent = meta.title;
    root.appendChild(t);
    y += 24;
  }
  if (meta && meta.legend && meta.legend.length) {
    let x = EXPORT_PAD;
    const rowH = 18;
    meta.legend.forEach((item) => {
      const colors = item.colors || [item.color];
      const w = colors.length * 13 + 4 + item.label.length * 6.2 + 16;
      if (x + w > totalW - EXPORT_PAD && x > EXPORT_PAD) { x = EXPORT_PAD; y += rowH; }
      colors.forEach((c, i) => {
        const r = document.createElementNS(NS, "rect");
        r.setAttribute("x", x + i * 13); r.setAttribute("y", y + 2); r.setAttribute("width", 10); r.setAttribute("height", 10); r.setAttribute("rx", 2);
        r.setAttribute("fill", c);
        root.appendChild(r);
      });
      const t = document.createElementNS(NS, "text");
      t.setAttribute("x", x + colors.length * 13 + 4); t.setAttribute("y", y + 11);
      t.setAttribute("font-size", "11"); t.setAttribute("fill", "#111111");
      t.textContent = item.label;
      root.appendChild(t);
      x += w;
    });
    y += rowH + 6;
  }

  // Custom height: make sure the chart fits the space left under the title and legend
  if (meta && meta.totalPx) scale = Math.min(scale, Math.max(0.1, (meta.totalPx - y - EXPORT_PAD) / ch));

  // Copy the chart, writing each text's font directly on it (page styles don't travel with the file)
  const clone = svgEl.cloneNode(true);
  const origTexts = svgEl.querySelectorAll("text");
  const cloneTexts = clone.querySelectorAll("text");
  origTexts.forEach((t, i) => {
    const cs = window.getComputedStyle(t);
    cloneTexts[i].setAttribute("font-family", cs.fontFamily);
    cloneTexts[i].removeAttribute("class");
  });
  clone.querySelectorAll("title").forEach((el) => el.remove());
  clone.querySelectorAll("[style]").forEach((el) => el.removeAttribute("style"));
  const g = document.createElementNS(NS, "g");
  g.setAttribute("transform", `translate(${EXPORT_PAD}, ${y}) scale(${scale}) translate(${-minX}, ${-minY})`);
  while (clone.firstChild) g.appendChild(clone.firstChild);
  root.appendChild(g);

  const totalH = meta && meta.totalPx ? meta.totalPx : Math.ceil(y + ch * scale + EXPORT_PAD);
  bg.setAttribute("height", totalH);
  root.setAttribute("width", totalW);
  root.setAttribute("height", totalH);
  root.setAttribute("viewBox", `0 0 ${totalW} ${totalH}`);
  return { text: new XMLSerializer().serializeToString(root), width: totalW, height: totalH };
}

async function exportSvgElement(svgEl, meta, format) {
  const filenameBase = slugify(meta && meta.filename);
  if (format === "svg") {
    const { text } = buildExportSvg(svgEl, meta, "");
    downloadBlob(new Blob([text], { type: "image/svg+xml" }), filenameBase + ".svg");
    return;
  }
  const fontCss = await getEmbeddedFontCss();
  const { text, width, height } = buildExportSvg(svgEl, meta, fontCss);
  const img = new Image();
  img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(text);
  await img.decode();
  const canvas = document.createElement("canvas");
  canvas.width = width * EXPORT_PNG_SCALE;
  canvas.height = height * EXPORT_PNG_SCALE;
  const ctx = canvas.getContext("2d");
  ctx.scale(EXPORT_PNG_SCALE, EXPORT_PNG_SCALE);
  ctx.drawImage(img, 0, 0, width, height);
  const raw = await new Promise((res) => canvas.toBlob(res, "image/png"));
  const png = await setPngDpi(raw, 96 * EXPORT_PNG_SCALE);
  downloadBlob(png, filenameBase + ".png");
}

// Width of a piece of text in pixels, in a given CSS font (used to fit numbers in charts)
const _measureCtx = typeof document !== "undefined" ? document.createElement("canvas").getContext("2d") : null;
function textWidth(text, font) {
  if (!_measureCtx) return String(text).length * 7;
  _measureCtx.font = font;
  return _measureCtx.measureText(String(text)).width;
}
// White text on dark bars, dark text on light bars
function textOnColor(hex) {
  const m = String(hex).match(/^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i);
  if (!m) return "#FFFFFF";
  const [r, g, b] = [m[1], m[2], m[3]].map((h) => parseInt(h, 16) / 255).map((c) => (c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4)));
  const lum = 0.2126 * r + 0.7152 * g + 0.0722 * b;
  // Pick whichever of white / near-black gives more contrast
  const contrastWhite = 1.05 / (lum + 0.05);
  const contrastDark = (lum + 0.05) / (0.0137 + 0.05);
  return contrastWhite >= contrastDark ? "#FFFFFF" : "#111111";
}

function fmtWeight(v) {
  const r = Math.round((Number(v) || 0) * 10) / 10;
  return Number.isInteger(r) ? String(r) : r.toFixed(1);
}

// Measures the width available to a chart and passes it in, so the chart is drawn at its real size
// (text keeps its size instead of being stretched with the card).
function MeasuredWidth({ children }) {
  const ref = useRef(null);
  const [w, setW] = useState(0);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const update = () => setW(Math.floor(el.getBoundingClientRect().width));
    update();
    let ro = null;
    if (typeof ResizeObserver !== "undefined") {
      ro = new ResizeObserver(update);
      ro.observe(el);
    } else {
      window.addEventListener("resize", update);
    }
    return () => { if (ro) ro.disconnect(); else window.removeEventListener("resize", update); };
  }, []);
  return <div ref={ref} style={{ width: "100%" }}>{w > 0 ? children(w) : null}</div>;
}

        const wb = XLSX.read(data, { type: "array" });
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const raw = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: null });
        if (!raw.length) {
          setError("This file doesn't seem to have any rows in it.");
          return;
        }

        // The first row holds the column names; roles and objective directions are set in the tool (step 3)
        const headerRow = raw[0] || [];
        const dataStart = 1;

        const cols = headerRow.map((h, i) => (h === null || h === "" ? `Column ${i + 1}` : String(h)));
        const dataRows = raw.slice(dataStart).filter((r) => r && r.some((v) => v !== null && v !== ""));
        const json = dataRows.map((r) => {
          const obj = {};
          cols.forEach((c, i) => { obj[c] = r[i] === undefined ? null : r[i]; });
          return obj;
        });

        if (!json.length) {
          setError("This file doesn't seem to have any data rows in it.");
          return;
        }

        const initRoles = {};
        cols.forEach((c) => {
          if (presetRoles && presetRoles[c]) {
            initRoles[c] = presetRoles[c];
          } else {
            const isNumeric = json.every((r) => r[c] === null || typeof r[c] === "number");
            initRoles[c] = isNumeric ? "variable" : "ignore";
          }
        });

        setColumns(cols);
        setRoles(initRoles);
        setRows(json);
        setWeights({});
        setXCol(null);
        setYCol(null);
        setFileName(name);
        setChartView("scatter");
        const initNames = {};
        cols.forEach((c) => { initNames[c] = c; });
        setDisplayNames(initNames);
        setAutoDetected(false);
        setLocked({});
        setScenarios([]);
        setShowSaveScenario(false);
        setShowTabSave(false);
        setTabScenarioName("");
        setVarGroups([]);
        setGroupEditor(null);
        setShowAllVarPlot(true);
        setAllPlotExcluded([]);
        setAllPlotPickerOpen(false);
        setPcHidden([]);
        setPcPanelOpen(true);
        const isLarge = json.length > LIVE_UPDATE_ROW_LIMIT;
        setLiveUpdates(!isLarge);
        setAutoLiveOff(isLarge);
      } catch (err) {
        setError("Couldn't read that file. Make sure it's a .xlsx or .xls spreadsheet.");
      }
  }

  // Example: loads sample-data.xlsx into the tool (used by the "Open example in the tool" button and by tool.html?demo=1)
  function openExample() {
    setError(null);
    fetch(DEMO_FILE)
      .then((r) => { if (!r.ok) throw new Error("not found"); return r.arrayBuffer(); })
      .then((buf) => {
        demoPendingRef.current = true;
        setDemoMode(true);
        loadWorkbook(buf, DEMO_FILE, DEMO.roles);
      })
      .catch(() => {
        setError("The example couldn't be loaded. It only works on the live website, not when the page is opened directly from your computer. You can still upload your own file.");
      });
  }

  useEffect(() => {
    let wantsDemo = false;
    try { wantsDemo = new URLSearchParams(window.location.search).get("demo") === "1"; } catch (e) {}
    if (wantsDemo) openExample();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  const objectives = useMemo(
    () => columns.filter((c) => roles[c] === "min" || roles[c] === "max"),
    [columns, roles]
  );
  const variables = useMemo(
    () => columns.filter((c) => roles[c] === "variable"),
    [columns, roles]
  );
  const objKey = objectives.join("|");

  useEffect(() => {
    if (!objectives.length) return;
    setWeights((prev) => {
      const next = {};
      objectives.forEach((o) => {
        next[o] = prev[o] !== undefined ? prev[o] : 100 / objectives.length;
      });
      return next;
    });
    setXCol((prev) => (prev && objectives.includes(prev) ? prev : objectives[0] || null));
    setYCol((prev) =>
      prev && objectives.includes(prev) ? prev : objectives[1] || objectives[0] || null
    );
    setScenXCol((prev) => (prev && objectives.includes(prev) ? prev : objectives[0] || null));
    setScenYCol((prev) =>
      prev && objectives.includes(prev) ? prev : objectives[1] || objectives[0] || null
    );
    setScenarios([]);
    setShowSaveScenario(false);
    setShowTabSave(false);
    setTabScenarioName("");
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [objKey]);

  // Demo: once the sample file is loaded, set objective directions, variable groups and the ready-made scenarios
  useEffect(() => {
    if (!demoPendingRef.current || !rows || !objectives.length) return;
    demoPendingRef.current = false;
    if (DEMO.objectiveOrder.every((o) => objectives.includes(o))) {
      setScenarios(DEMO.scenarios.map((sc, i) => {
        const w = {};
        objectives.forEach((o) => { w[o] = 0; });
        DEMO.objectiveOrder.forEach((o, k) => { w[o] = sc.w[k]; });
        return { id: "demo-scenario-" + i, name: sc.name, weights: w, color: SCENARIO_COLORS[i % SCENARIO_COLORS.length] };
      }));
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [objKey, rows]);

  // Given a set of weights, set one objective to a new value and share the rest among the unlocked others
  function redistribute(prev, col, newVal) {
    {
      const lockedOthersSum = objectives
        .filter((o) => o !== col && locked[o])
        .reduce((s, o) => s + (prev[o] || 0), 0);
      const maxAllowed = 100 - lockedOthersSum;
      const clamped = Math.min(newVal, maxAllowed);
      const others = objectives.filter((o) => o !== col && !locked[o]);
      const remaining = maxAllowed - clamped;
      const othersSum = others.reduce((s, o) => s + (prev[o] || 0), 0);
      const next = { ...prev, [col]: clamped };
      if (others.length > 0) {
        if (othersSum <= 0) {
          const share = remaining / others.length;
          others.forEach((o) => { next[o] = share; });
        } else {
          others.forEach((o) => {
            next[o] = ((prev[o] || 0) / othersSum) * remaining;
          });
        }
      }
      return next;
    }
  }

  // The sliders always update right away. The rankings/charts use the applied weights,
  // which follow the sliders automatically only when "Live updates" is on.
  function commitWeight(col, rawVal) {
    const newVal = Math.max(0, Math.min(100, rawVal));
    if (liveUpdates) {
      // Update the applied weights AND the sliders, so the sliders always show the corrected values
      setWeights((prev) => {
        const next = redistribute(prev, col, newVal);
        setDraftWeights(next);
        return next;
      });
    } else {
      setDraftWeights((prev) => redistribute({ ...weights, ...prev }, col, newVal));
    }
  }

  function sliderWeights() {
    const w = {};
    objectives.forEach((o) => { w[o] = draftWeights[o] ?? weights[o] ?? 0; });
    return w;
  }

  function applyWeights() {
    setWeights(sliderWeights());
  }

  function setLiveMode(on) {
    setLiveUpdates(on);
    setAutoLiveOff(false);
    if (on) applyWeights();
  }

  // Fast path for slider dragging: update the on-screen number instantly,
  // but wait briefly before running the real recalculation across all objectives.
  function draftWeightChange(col, val) {
    // Don't let a slider go past what the locked weights leave free (e.g. max 60% if another is locked at 40%)
    setDraftWeights((prev) => {
      const base = { ...weights, ...prev };
      const lockedOthersSum = objectives
        .filter((o) => o !== col && locked[o])
        .reduce((sum, o) => sum + (base[o] || 0), 0);
      return { ...prev, [col]: Math.min(val, 100 - lockedOthersSum) };
    });
    clearTimeout(weightDebounceRef.current);
    weightDebounceRef.current = setTimeout(() => commitWeight(col, val), 60);
  }

  function toggleLock(col) {
    setLocked((prev) => {
      const willLock = !prev[col];
      if (willLock) {
        const unlockedCount = objectives.filter((o) => o !== col && !prev[o]).length;
        if (unlockedCount === 0) return prev; // never allow locking the last unlocked objective
      }
      return { ...prev, [col]: willLock };
    });
  }

  useEffect(() => {
    // Before a file is loaded there is nothing to switch between, so keep the default (2D scatter) tab
    if (objectives.length === 0 && variables.length === 0) return;
    if (chartView === "varparallel") {
      setChartView("parallel");
    } else if (chartView === "scatter" && objectives.length < 2) {
      setChartView(objectives.length + variables.length >= 2 ? "parallel" : "scenarios");
    } else if (chartView === "parallel" && objectives.length + variables.length < 2) {
      setChartView("scenarios");
    } else if (chartView === "histograms" && variables.length === 0) {
      setChartView(objectives.length >= 2 ? "scatter" : "scenarios");
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [objectives.length, variables.length]);

  useEffect(() => {
    setDraftWeights(weights);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [JSON.stringify(weights)]);

  useEffect(() => {
    setTopNDraft(String(topN));
  }, [topN]);

  function saveScenario(rawName) {
    const name = (rawName !== undefined ? rawName : newScenarioName).trim();
    if (!name || scenarios.length >= 8) return;
    const color = SCENARIO_COLORS[scenarios.length % SCENARIO_COLORS.length];
    const w = sliderWeights();
    if (!liveUpdates) setWeights(w);
    setScenarios((prev) => [...prev, { id: Date.now() + "-" + Math.random(), name, weights: w, color }]);
    setNewScenarioName("");
    setShowSaveScenario(false);
    setTabScenarioName("");
    setShowTabSave(false);
  }

  function commitTopN(val) {
    const n = Math.max(1, Number(val) || 1);
    setTopN(n);
    setTopNDraft(String(n));
  }

  function setRole(col, role) {
    setRoles((prev) => ({ ...prev, [col]: role }));
  }

  function computeResultsForWeights(weightsObj) {
    if (!rows || objectives.length < 1) return null;
    const X = rows.map((r) => objectives.map((o) => Number(r[o])));
    const denom = objectives.map((_, j) => {
      const s = Math.sqrt(X.reduce((acc, row) => acc + row[j] * row[j], 0));
      return s || 1;
    });
    const R = X.map((row) => row.map((v, j) => v / denom[j]));
    const wsum = objectives.reduce((s, o) => s + (weightsObj[o] || 0), 0) || 1;
    const W = objectives.map((o) => (weightsObj[o] || 0) / wsum);
    const V = R.map((row) => row.map((v, j) => v * W[j]));
    const best = objectives.map((o, j) => {
      const col = V.map((row) => row[j]);
      return roles[o] === "max" ? Math.max(...col) : Math.min(...col);
    });
    const worst = objectives.map((o, j) => {
      const col = V.map((row) => row[j]);
      return roles[o] === "max" ? Math.min(...col) : Math.max(...col);
    });
    const scored = rows.map((r, i) => {
      const row = V[i];
      const dPlus = Math.sqrt(row.reduce((s, v, j) => s + (v - best[j]) ** 2, 0));
      const dMinus = Math.sqrt(row.reduce((s, v, j) => s + (v - worst[j]) ** 2, 0));
      const c = dPlus + dMinus === 0 ? 0 : dMinus / (dPlus + dMinus);
      return { row: r, score: c, rowNum: i + 1 };
    });
    scored.sort((a, b) => b.score - a.score);
    return scored.map((item, idx) => ({ ...item, rank: idx + 1 }));
  }

  const results = useMemo(() => {
    return computeResultsForWeights(weights);
  }, [rows, objKey, JSON.stringify(weights), JSON.stringify(roles)]);

  const chartData = useMemo(() => {
    if (!results || !xCol || !yCol) return null;
    const xs = results.map((r) => Number(r.row[xCol]));
    const ys = results.map((r) => Number(r.row[yCol]));
    const xMin = Math.min(...xs), xMax = Math.max(...xs);
    const yMin = Math.min(...ys), yMax = Math.max(...ys);
    return { xs, ys, xMin, xMax, yMin, yMax };
  }, [results, xCol, yCol]);

  // Scatter chart size: height is directly controlled by our own drag handle (reliable),
  // width is measured passively since it only changes with window/layout resizes, not dragging.
  const scatterContainerRef = useRef(null);
  const [scatterHeight, setScatterHeight] = useState(380);
  const [scatterWidth, setScatterWidth] = useState(600);
  useEffect(() => {
    if (chartView !== "scatter") return;
    function measure() {
      const el = scatterContainerRef.current;
      // Prefer a direct measurement of the container when available and non-zero...
      if (el) {
        const rect = el.getBoundingClientRect();
        // getBoundingClientRect includes the container's own padding, but the SVG only
        // has the CONTENT area to draw in (padding: 14px right, 74px left = 88px total) — subtract it.
        const contentWidth = rect.width - 76;
        if (contentWidth > 0) {
          setScatterWidth(contentWidth);
          return;
        }
      }
      // ...otherwise fall back to computing it from the window's own width directly,
      // which reliably updates on every resize regardless of nested-layout quirks.
      const sidebarWidth = 284, mainPadding = 48, chartPadding = 76, borders = 2;
      const fallback = Math.max(200, window.innerWidth - sidebarWidth - mainPadding - chartPadding - borders);
      setScatterWidth(fallback);
    }
    measure();
    window.addEventListener("resize", measure);
    const interval = setInterval(measure, 400); // safety net in case resize events are swallowed in this environment
    return () => {
      window.removeEventListener("resize", measure);
      clearInterval(interval);
    };
  }, [chartView]);

  function startScatterResize(e) {
    e.preventDefault();
    const startY = e.clientY;
    const startHeight = scatterHeight;
    function onMove(ev) {
      setScatterHeight(Math.max(300, startHeight + (ev.clientY - startY)));
    }
    function onUp() {
      window.removeEventListener("mousemove", onMove);
      window.removeEventListener("mouseup", onUp);
    }
    window.addEventListener("mousemove", onMove);
    window.addEventListener("mouseup", onUp);
  }

  function startParallelResize(e) {
    e.preventDefault();
    const startY = e.clientY;
    const startHeight = parallelHeight;
    function onMove(ev) {
      setParallelHeight(Math.max(300, startHeight + (ev.clientY - startY)));
    }
    function onUp() {
      window.removeEventListener("mousemove", onMove);
      window.removeEventListener("mouseup", onUp);
    }
    window.addEventListener("mousemove", onMove);
    window.addEventListener("mouseup", onUp);
  }

  const [scenXCol, setScenXCol] = useState(null);
  const [scenYCol, setScenYCol] = useState(null);
  const scenScatterContainerRef = useRef(null);
  const [scenScatterWidth, setScenScatterWidth] = useState(600);
  const [scenScatterHeight, setScenScatterHeight] = useState(380);
  useEffect(() => {
    if (chartView !== "scenarios") return;
    function measure() {
      const el = scenScatterContainerRef.current;
      if (el) {
        const rect = el.getBoundingClientRect();
        const contentWidth = rect.width - 76;
        if (contentWidth > 0) { setScenScatterWidth(contentWidth); return; }
      }
      const sidebarWidth = 284, mainPadding = 48, chartPadding = 76, borders = 2;
      const fallback = Math.max(200, window.innerWidth - sidebarWidth - mainPadding - chartPadding - borders);
      setScenScatterWidth(fallback);
    }
    measure();
    window.addEventListener("resize", measure);
    const interval = setInterval(measure, 400);
    return () => {
      window.removeEventListener("resize", measure);
      clearInterval(interval);
    };
  }, [chartView]);
  function startScenScatterResize(e) {
    e.preventDefault();
    const startY = e.clientY;
    const startHeight = scenScatterHeight;
    function onMove(ev) {
      setScenScatterHeight(Math.max(300, startHeight + (ev.clientY - startY)));
    }
    function onUp() {
      window.removeEventListener("mousemove", onMove);
      window.removeEventListener("mouseup", onUp);
    }
    window.addEventListener("mousemove", onMove);
    window.addEventListener("mouseup", onUp);
  }

  // Parallel coordinates: normalize each objective so "better" always sits near the top of its axis
  const pcRanges = useMemo(() => {
    if (!results || objectives.length < 2) return null;
    return objectives.map((o) => {
      const vals = results.map((r) => Number(r.row[o]));
      return { min: Math.min(...vals), max: Math.max(...vals) };
    });
  }, [results, objKey]);

  function getVariableHistogram(colName) {
    const vals = results.map((r) => Number(r.row[colName]));
    const unique = Array.from(new Set(vals)).sort((a, b) => a - b);
    let bins;
    if (unique.length <= 12) {
      bins = unique.map((u) => ({ label: fmtShort(u), full: fmtNum(u), test: (v) => v === u }));
    } else {
      const min = Math.min(...vals), max = Math.max(...vals);
      const nBins = 8;
      const width = (max - min) / nBins || 1;
      bins = Array.from({ length: nBins }, (_, i) => {
        const lo = min + i * width;
        const hi = i === nBins - 1 ? max : min + (i + 1) * width;
        return {
          label: `${fmtShort(lo)}–${fmtShort(hi)}`,
          full: `${fmtNum(lo)}–${fmtNum(hi)}`,
          test: (v) => (i === nBins - 1 ? v >= lo && v <= hi : v >= lo && v < hi),
        };
      });
    }
    const counts = bins.map((b) => results.filter((r) => b.test(Number(r.row[colName]))).length);
    const maxCount = Math.max(...counts, 1);
    const topMarkers = bins.map(() => []);
    results.filter((r) => r.rank <= topN).forEach((r) => {
      const v = Number(r.row[colName]);
      const idx = bins.findIndex((b) => b.test(v));
      if (idx >= 0) topMarkers[idx].push(r.rank);
    });
    return { bins, counts, maxCount, topMarkers };
  }

  const parallelContainerRef = useRef(null);
  const [parallelWidth, setParallelWidth] = useState(600);
  const [parallelHeight, setParallelHeight] = useState(420);
  useEffect(() => {
    if (chartView !== "parallel") return;
    function measure() {
      const el = parallelContainerRef.current;
      if (el) {
        const rect = el.getBoundingClientRect();
        if (rect.width > 0) {
          setParallelWidth(rect.width);
          return;
        }
      }
      const sidebarWidth = 284, mainPadding = 48, borders = 2;
      const fallback = Math.max(200, window.innerWidth - sidebarWidth - mainPadding - borders);
      setParallelWidth(fallback);
    }
    measure();
    window.addEventListener("resize", measure);
    const interval = setInterval(measure, 400);
    return () => {
      window.removeEventListener("resize", measure);
      clearInterval(interval);
    };
  }, [chartView]);

  const scenPcContainerRef = useRef(null);
  const [scenPcWidth, setScenPcWidth] = useState(600);
  useEffect(() => {
    if (chartView !== "scenarios") return;
    function measure() {
      const el = scenPcContainerRef.current;
      if (el) {
        const rect = el.getBoundingClientRect();
        if (rect.width > 0) { setScenPcWidth(rect.width - 2); return; }
      }
      const sidebarWidth = 284, mainPadding = 48, borders = 2;
      setScenPcWidth(Math.max(200, window.innerWidth - sidebarWidth - mainPadding - borders));
    }
    measure();
    window.addEventListener("resize", measure);
    const interval = setInterval(measure, 400);
    return () => {
      window.removeEventListener("resize", measure);
      clearInterval(interval);
    };
  }, [chartView]);

  function pcGoodness(value, idx) {
    const { min, max } = pcRanges[idx];
    if (max === min) return 0.5;
    const norm = (value - min) / (max - min);
    return roles[objectives[idx]] === "max" ? norm : 1 - norm;
  }

  // If a column stops being a variable (relabeled in step 2), remove it from every group
  const varKey = variables.join("|");
  useEffect(() => {
    setVarGroups((prev) => prev.map((g) => ({ ...g, vars: g.vars.filter((v) => variables.includes(v)) })));
    setGroupEditor((prev) => (prev ? { ...prev, vars: prev.vars.filter((v) => variables.includes(v)) } : prev));
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [varKey]);

  const varPcContainerRef = useRef(null);
  const [varPcWidth, setVarPcWidth] = useState(600);
  useEffect(() => {
    if (chartView !== "varparallel") return;
    function measure() {
      const el = varPcContainerRef.current;
      if (el) {
        const rect = el.getBoundingClientRect();
        if (rect.width > 0) { setVarPcWidth(rect.width - 2); return; }
      }
      const sidebarWidth = 284, mainPadding = 48, borders = 2;
      setVarPcWidth(Math.max(200, window.innerWidth - sidebarWidth - mainPadding - borders));
    }
    measure();
    window.addEventListener("resize", measure);
    const interval = setInterval(measure, 400);
    return () => {
      window.removeEventListener("resize", measure);
      clearInterval(interval);
    };
  }, [chartView]);

  function saveGroupEditor() {
    if (!groupEditor) return;
    const name = groupEditor.name.trim();
    if (!name || groupEditor.vars.length === 0) return;
    if (groupEditor.id) {
      setVarGroups((prev) => prev.map((g) => (g.id === groupEditor.id ? { ...g, name, vars: [...groupEditor.vars] } : g)));
    } else {
      setVarGroups((prev) => [...prev, { id: Date.now() + "-" + Math.random(), name, vars: [...groupEditor.vars] }]);
    }
    setGroupEditor(null);
  }

  function toggleEditorVar(v) {
    setGroupEditor((prev) => {
      if (!prev) return prev;
      const has = prev.vars.includes(v);
      return { ...prev, vars: has ? prev.vars.filter((x) => x !== v) : [...prev.vars, v] };
    });
  }

  // Each scenario's winning design plus designs tied with it; scenarios that picked the same design share one line
  function getScenarioLines() {
    const perScen = scenarios.map((sc) => {
      const res = computeResultsForWeights(sc.weights) || [];
      const winner = res[0];
      const ties = winner ? res.filter((r) => r.rowNum !== winner.rowNum && Math.abs(r.score - winner.score) < 1e-9) : [];
      return { sc, winner, ties };
    });
    const winnerLines = [];
    perScen.forEach((p) => {
      if (!p.winner) return;
      const existing = winnerLines.find((l) => l.result.rowNum === p.winner.rowNum);
      if (existing) existing.scens.push(p.sc);
      else winnerLines.push({ result: p.winner, scens: [p.sc] });
    });
    return { perScen, winnerLines };
  }

  // ---------- Parallel coordinates: variables (left) then objectives (right) ----------
  const PC_MONO = "9px 'Cascadia Code', ui-monospace, monospace";
  function pcShownColumns() {
    return [
      ...variables.filter((v) => !pcHidden.includes(v)).map((c) => ({ col: c, kind: "var" })),
      ...objectives.filter((o) => !pcHidden.includes(o)).map((c) => ({ col: c, kind: "obj" })),
    ];
  }
  function pcChartW() {
    const inches = pcSizeMode === "custom" ? Math.min(40, Math.max(3, Number(pcCustomIn) || 6.5)) : Number(pcSizeMode);
    return Math.round(inches * 96) - EXPORT_PAD * 2;
  }
  function pcExportMeta(filename, extra) {
    const base = { filename, ...(extra || {}) };
    if (pcSizeMode === "custom") {
      const w = Math.min(40, Math.max(3, Number(pcCustomIn) || 6.5));
      const h = Math.min(30, Math.max(2, Number(pcCustomH) || 5));
      return exportSize(base, w, h);
    }
    return { ...base, chartW: pcChartW() };
  }
  function pcHeightFor(key, screenH) {
    const m = exportTarget === key && exportJobRef.current && exportJobRef.current.meta;
    return m && m.chartH ? m.chartH : screenH;
  }
  // Same idea for the 2D scatter plots
  function scatExportMeta(meta) {
    if (scatSizeMode !== "custom") return meta;
    const w = Math.min(40, Math.max(3, Number(scatCustomW) || 6.5));
    const h = Math.min(30, Math.max(2, Number(scatCustomH) || 4));
    return exportSize(meta, w, h);
  }
  function scatDims(key, screenW, screenH) {
    const m = exportTarget === key && exportJobRef.current && exportJobRef.current.meta;
    if (!m) return { W: screenW, H: screenH };
    return { W: m.chartW || EXPORT_W, H: m.chartH || screenH };
  }
  function pcWidthFor(key, screenW) {
    if (exportTarget === key) return (exportJobRef.current && exportJobRef.current.meta && exportJobRef.current.meta.chartW) || EXPORT_W;
    return screenW;
  }

  // Checkbox list (open by default) to choose which axes appear
  function pcChecklist() {

        >
          <span>Axes shown <span style={{ fontWeight: 400, color: MUTED, fontSize: 12 }}>({shownCount} of {total}). Untick any objective or design parameter to hide it.</span></span>
          <span style={{ color: MUTED, fontSize: 12 }}>{pcPanelOpen ? "Hide ▴" : "Show ▾"}</span>
        </button>
        {pcPanelOpen && (
          <div style={{ padding: "0 14px 12px", borderTop: `1px solid ${BORDER}` }}>
            <div style={{ display: "flex", gap: 6, marginTop: 10, flexWrap: "wrap" }}>
              <button style={small} onClick={() => setPcHidden([])}>Tick all</button>
              <button style={small} onClick={() => setPcHidden([...variables, ...objectives])}>Untick all</button>
              {variables.length > 0 && <button style={small} onClick={() => setPcHidden((prev) => Array.from(new Set([...prev, ...variables])))}>Hide all design parameters</button>}
            </div>
            {section("Design parameters", variables, TEXT)}
            {section("Objectives", objectives, EMERALD)}
          </div>

  // Download width choice for the parallel coordinates plots
  function pcSizeControl() {
    const sel = { fontSize: 10.5, color: MUTED, border: `1px solid ${BORDER}`, borderRadius: 4, padding: "1px 4px", background: "#fff" };
    return (
      <span style={{ display: "inline-flex", alignItems: "center", gap: 4, fontSize: 10.5, color: MUTED }}>
        Width:
        <select value={pcSizeMode} onChange={(e) => setPcSizeMode(e.target.value)} style={sel} title="Size of the downloaded image">
          <option value="6.5">6.5 in (portrait page)</option>
          <option value="9">9 in (landscape page)</option>
          <option value="custom">Custom (width × height)</option>
        </select>
        {pcSizeMode === "custom" && (
          <>
            <input
              type="text" inputMode="decimal" value={pcCustomIn}
              onChange={(e) => { if (/^\d{0,2}(\.\d?)?$/.test(e.target.value)) setPcCustomIn(e.target.value); }}
              style={{ ...sel, width: 38, textAlign: "right" }} title="Width in inches (3 to 40)"
            />
            in ×
            <input
              type="text" inputMode="decimal" value={pcCustomH}
              onChange={(e) => { if (/^\d{0,2}(\.\d?)?$/.test(e.target.value)) setPcCustomH(e.target.value); }}
              style={{ ...sel, width: 38, textAlign: "right" }} title="Height in inches (2 to 30)"
            />
            in

  // Axis title size for the scatter plots: 14 px normally, smaller (down to 9 px) when the title is longer than the space for it
  function axisTitleSize(text, room) {
    const w = textWidth(text, "600 14px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif");
    return w <= room ? 14 : Math.max(9, Math.floor((14 * room) / w * 10) / 10);
  }

  // Download size choice for the 2D scatter plots
  function scatSizeControl() {
    const sel = { fontSize: 10.5, color: MUTED, border: `1px solid ${BORDER}`, borderRadius: 4, padding: "1px 4px", background: "#fff" };
    const box = (val, set, title) => (

        type="text" inputMode="decimal" value={val}
        onChange={(e) => { if (/^\d{0,2}(\.\d?)?$/.test(e.target.value)) set(e.target.value); }}
        style={{ ...sel, width: 38, textAlign: "right" }} title={title}

        {scatSizeMode === "custom" && (
          <>
            {box(scatCustomW, setScatCustomW, "Width in inches (3 to 40)")}
            in ×
            {box(scatCustomH, setScatCustomH, "Height in inches (2 to 30)")}
            in
          </>

  // Splits an axis title into up to maxLines lines of at most maxChars characters, breaking between words where possible
  function wrapWords(text, maxChars, maxLines) {
    const words = String(text).split(/\s+/).filter(Boolean);
    const lines = [];
    let cur = "";
    words.forEach((w) => {
      while (w.length > maxChars + 2) { // a single word much longer than the line: split it (up to 2 extra characters may stick out)
        if (cur) { lines.push(cur); cur = ""; }
        lines.push(w.slice(0, maxChars)); w = w.slice(maxChars);
      }
      if (!cur) cur = w;
      else if ((cur + " " + w).length <= maxChars) cur += " " + w;
      else { lines.push(cur); cur = w; }
    });
    if (cur) lines.push(cur);
    if (lines.length > maxLines) {
      const kept = lines.slice(0, maxLines);
      kept[maxLines - 1] = kept[maxLines - 1].slice(0, Math.max(1, maxChars - 1)) + "…";
      return kept;
    }
    return lines;
  }

  // Draws the parallel coordinates plot. mode "main": top designs in color, others grey. mode "scen": scenario winners (+ faded ties).
  function renderPcSvg(exportKey, W, H, mode, lines) {
    const cols = pcShownColumns();
    const n = cols.length;
    const hasObj = cols.some((c) => c.kind === "obj");
    const info = cols.map((c) => {
      const vals = results.map((r) => Number(r.row[c.col])).filter((x) => Number.isFinite(x));
      const min = vals.length ? Math.min(...vals) : 0;
      const max = vals.length ? Math.max(...vals) : 0;
      const counts = new Map();
      vals.forEach((x) => counts.set(x, (counts.get(x) || 0) + 1));
      const unique = Array.from(counts.keys()).sort((a, b) => a - b);
      return { ...c, min, max, constant: min === max, counts, unique, discrete: unique.length <= 12, isMax: roles[c.col] === "max" };
    });
    // Side margins leave room for the end labels of objective axes and the titles of the outer axes
    const endHalf = Math.max(0, ...info.filter((a, i) => a.kind === "obj" && (i === 0 || i === n - 1)).map((a) => Math.max(textWidth(fmtShort(a.min), PC_MONO), textWidth(fmtShort(a.max), PC_MONO)) / 2));
    const marginSide = Math.max(56, Math.ceil(endHalf + 8));
    // Space between neighbouring axes decides how long title lines can be (about 6.3 px per character at size 10.5)
    const spacing = n === 1 ? W - marginSide * 2 : (W - marginSide * 2) / (n - 1);
    const maxChars = Math.max(5, Math.floor((spacing - 6) / 6.3));
    const nameUnit = info.map((a) => splitUnit(labelFor(a.col)));
    const titles = nameUnit.map((nu) => wrapWords(nu.name, maxChars, 3));
    const units = nameUnit.map((nu) => (nu.unit ? wrapWords("(" + nu.unit + ")", maxChars, 1)[0] : ""));
    const hasUnits = units.some((u) => u);
    const titleLinesMax = Math.max(1, ...titles.map((t) => t.length)) + (hasUnits ? 1 : 0);
    // "lower = better" goes on two lines when the axes are close together
    const betterTwoLines = spacing < 95;
    const marginTop = 30 + titleLinesMax * 13, marginBottom = hasObj ? (betterTwoLines ? 56 : 46) : 30;
    const plotTop = marginTop, plotBottom = H - marginBottom, plotH = plotBottom - plotTop;
    const axisX = (i) => (n === 1 ? W / 2 : marginSide + i * ((W - marginSide * 2) / (n - 1)));
    const yFor = (value, a) => {
      if (a.constant) return plotTop + plotH / 2;
      const t = (value - a.min) / (a.max - a.min);
      const good = a.kind === "obj" ? (a.isMax ? t : 1 - t) : t; // objectives: "better" at the top; variables: highest at the top
      return plotBottom - good * plotH;
    };
    const pointsFor = (r) => {
      const pts = [];
      info.forEach((a, i) => { const v = Number(r.row[a.col]); if (Number.isFinite(v)) pts.push(`${axisX(i)},${yFor(v, a)}`); });
      return pts.join(" ");
    };
    return (
      <svg data-export={exportKey} width={W} height={H} viewBox={`0 0 ${W} ${H}`} style={{ display: "block", overflow: "visible" }}>
        {info.map((a, i) => {
          const x = axisX(i);
          const isFirst = i === 0, isLast = i === n - 1 && n > 1;
          const titleLines = titles[i];
          // Titles are centred on their axis; the outer ones are nudged inward only if they would run off the edge
          const halfTitle = (Math.max(...titleLines.map((l) => l.length), units[i].length) * 6.3) / 2;
          const anchor = "middle";
          const titleX = Math.min(Math.max(x, halfTitle + 2), W - halfTitle - 2);
          const titleColor = a.kind === "obj" ? EMERALD : TEXT;
          const tickAnchor = isLast ? "end" : "start";
          const tickX = isLast ? x - 6 : x + 6;
          const roomy = a.discrete && a.unique.length > 0 && plotH / Math.max(1, a.unique.length - 1) >= 13;
          const ticks = a.constant ? [a.min] : roomy ? a.unique : [a.min, a.max];
          return (
            <g key={a.col}>
              <line x1={x} x2={x} y1={plotTop} y2={plotBottom} stroke={a.kind === "obj" ? "#9FC7B6" : "#C9C9C5"} strokeWidth={a.kind === "obj" ? 1.5 : 1} />
              {titleLines.map((line, li) => (
                <text key={li} x={titleX} y={15 + li * 13} textAnchor={anchor} fontSize="10.5" fontWeight="600" fill={titleColor} className="mono">{line}</text>
              ))}
              {units[i] && (
                <text x={titleX} y={15 + titleLines.length * 13} textAnchor={anchor} fontSize="9.5" fill={a.kind === "obj" ? EMERALD : MUTED} className="mono">{units[i]}</text>
              )}
              {a.kind === "var" ? (
                ticks.map((t) => (
                  <g key={t}>
                    <line x1={x - 3} x2={x + 3} y1={yFor(t, a)} y2={yFor(t, a)} stroke="#9A9A96" strokeWidth="1" />
                    <text x={tickX} y={yFor(t, a) + 3} textAnchor={tickAnchor} fontSize="9" fill={MUTED} className="mono">
                      {fmtShort(t)}{mode === "main" && (roomy || a.constant) ? ` (${a.counts.get(t) || 0})` : ""}
                    </text>
                  </g>
                ))
              ) : (
                <>
                  <text x={x} y={plotTop - 6} textAnchor="middle" fontSize="9.5" fill={EMERALD} className="mono">{fmtShort(a.isMax ? a.max : a.min)}</text>
                  <text x={x} y={plotBottom + 15} textAnchor="middle" fontSize="9.5" fill={MUTED} className="mono">{fmtShort(a.isMax ? a.min : a.max)}</text>
                  {betterTwoLines ? (
                    <>
                      <text x={x} y={H - 22} textAnchor="middle" fontSize="10" fill={EMERALD}>{a.isMax ? "higher" : "lower"}</text>
                      <text x={x} y={H - 10} textAnchor="middle" fontSize="10" fill={EMERALD}>= better</text>
                    </>
                  ) : (
                    <text x={x} y={H - 10} textAnchor="middle" fontSize="10" fill={EMERALD}>{a.isMax ? "higher = better" : "lower = better"}</text>
                  )}
                </>
              )}
              {a.kind === "var" && a.constant && <text x={x} y={plotBottom + 18} textAnchor="middle" fontSize="9.5" fill={MUTED}>same in all solutions</text>}
            </g>
          );
        })}

        {mode === "main" && [...results]
          .sort((a, b) => (a.rank <= topN) - (b.rank <= topN) || b.rank - a.rank)
          .map((r) => {
            const isTop = r.rank <= topN;
            const isHover = hoverLine && hoverLine.rank === r.rank;
            return (
              <polyline
                key={r.rank} points={pointsFor(r)} fill="none" stroke={rankColor(r.rank)}
                strokeWidth={isHover ? 4 : isTop ? 2.5 : 1} opacity={isTop || isHover ? 1 : 0.4}
                onMouseEnter={() => setHoverLine(r)} onMouseLeave={() => setHoverLine(null)} style={{ cursor: "pointer" }}
              />
            );
          })}

        {mode === "scen" && lines && lines.perScen.map((p) => p.ties.map((r) => {
          const isHover = hoverScenLine && hoverScenLine.kind === "tie" && hoverScenLine.scen.id === p.sc.id && hoverScenLine.result.rowNum === r.rowNum;
          return (
            <polyline
              key={p.sc.id + "-" + r.rowNum} points={pointsFor(r)} fill="none"
              stroke={lerpColor(p.sc.color, "#FFFFFF", 0.45)} strokeWidth={isHover ? 3 : 1.4}
              onMouseEnter={() => setHoverScenLine({ kind: "tie", scen: p.sc, result: r, identical: objectives.every((o) => Number(r.row[o]) === Number(p.winner.row[o])), winnerRow: p.winner.rowNum })}
              onMouseLeave={() => setHoverScenLine(null)} style={{ cursor: "pointer" }}
            />
          );
        }))}
        {mode === "scen" && lines && lines.winnerLines.map((l) => {
          const k = l.scens.length;
          const isHover = hoverScenLine && hoverScenLine.kind === "winner" && hoverScenLine.result.rowNum === l.result.rowNum;
          return (
            <g key={l.result.rowNum} onMouseEnter={() => setHoverScenLine({ kind: "winner", scens: l.scens, result: l.result })} onMouseLeave={() => setHoverScenLine(null)} style={{ cursor: "pointer" }}>
              {l.scens.map((sc, i) => (
                <polyline
                  key={sc.id} points={pointsFor(l.result)} fill="none" stroke={sc.color} strokeWidth={isHover ? 4.5 : 3}
                  strokeDasharray={k > 1 ? `8 ${8 * (k - 1)}` : undefined} strokeDashoffset={k > 1 ? -8 * i : undefined}
                />
              ))}
            </g>
          );
        })}
      </svg>
    );
  }

  // Hover box listing a design's values for the axes currently shown
  function pcHoverValues(row) {
    return pcShownColumns().map((c) => (
      <div key={c.col} style={{ overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", color: c.kind === "obj" ? EMERALD_DARK : TEXT }}>{labelFor(c.col)}: {fmtNum(Number(row[c.col]))}</div>
    ));
  }

  function startExport(key, format, meta) {
    if (exportTarget) return;
    setExportError("");
    setHoverLine(null); setHoverVarLine(null); setHoverScenLine(null); setHoverScenVarLine(null); setHoverScenPoint(null); setHoverPoint(null);
    exportJobRef.current = { key, format, meta };
    setExportTarget(key);
  }

  useEffect(() => {
    if (!exportTarget || !exportJobRef.current) return;
    const job = exportJobRef.current;
    // Wait two frames so the chart has been redrawn at export size before capturing it
    requestAnimationFrame(() => requestAnimationFrame(async () => {
      const el = document.querySelector(`[data-export="${CSS.escape(job.key)}"]`);
      try {
        if (!el) throw new Error("chart not found");
        const clone = el.cloneNode(true);
        // Measure on the live element, then let the screen go back to normal right away
        const holder = document.createElement("div");
        holder.style.cssText = "position:absolute;left:-10000px;top:0;visibility:hidden;";
        holder.appendChild(clone);
        el.ownerDocument.body.appendChild(holder);
        // Copy computed fonts from the live chart before it changes back
        const liveTexts = el.querySelectorAll("text");
        clone.querySelectorAll("text").forEach((t, i) => { t.style.fontFamily = window.getComputedStyle(liveTexts[i]).fontFamily; });
        setExportTarget(null);
        exportJobRef.current = null;
        await exportSvgElement(clone, job.meta, job.format);
        holder.remove();
      } catch (e) {
        setExportTarget(null);
        exportJobRef.current = null;
        setExportError("Sorry, that chart couldn't be downloaded. Please try again, or try the other format.");
      }
    }));
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [exportTarget]);

  // Small PNG / SVG buttons shown next to each chart
  function dlButtons(key, meta) {
    const btn = { fontSize: 10, fontWeight: 600, color: MUTED, background: "#fff", border: `1px solid ${BORDER}`, borderRadius: 4, padding: "1px 6px", cursor: exportTarget ? "wait" : "pointer", lineHeight: 1.5 };
    return (
      <span style={{ display: "inline-flex", gap: 4, flexShrink: 0, alignItems: "center" }}>
        <button style={btn} disabled={!!exportTarget} title="Download as a PNG image" onClick={() => startExport(key, "png", meta)}>↓ PNG</button>
        <button style={btn} disabled={!!exportTarget} title="Download as an SVG (sharp at any size, editable)" onClick={() => startExport(key, "svg", meta)}>↓ SVG</button>
      </span>
    );
  }

  // Histogram drawn as SVG so it can be downloaded. markerBins[i] = markers above bar i: { color, shape: "dot" | "square", title }
  function renderHistSvg(exportKey, v, markerBins, availW) {
    const { bins, counts, maxCount } = getVariableHistogram(v);
    const isExp = exportTarget === exportKey;
    const W = isExp ? EXPORT_W : Math.max(220, availW || 300);
    const H = isExp ? 280 : 228;
    // Count scale: round, whole-number steps (1, 2, 5, 10, 20, 50 ...) giving about 4 grid lines
    const rough = Math.max(1, maxCount / 4);
    const mag = Math.pow(10, Math.floor(Math.log10(rough)));
    const step = [1, 2, 5, 10].map((m) => m * mag).find((c) => c >= rough && Number.isInteger(c)) || Math.max(1, Math.ceil(rough));
    const yMax = Math.max(step, Math.ceil(maxCount / step) * step);
    const ticks = [];
    for (let t = 0; t <= yMax + 1e-9; t += step) ticks.push(t);
    const tickFont = (isExp ? 10 : 9) + "px 'Cascadia Code', ui-monospace, monospace";
    const tickW = Math.max(...ticks.map((t) => textWidth(fmtNum(t), tickFont)));
    const titleSize = isExp ? 10.5 : 9.5;
    const plotLeft = titleSize + 8 + tickW + 6; // room for the "Number of solutions" title and the count numbers
    const plotW = W - plotLeft;
    const nb = bins.length;
    const gap = Math.max(3, Math.min(8, plotW / nb * 0.08));
    // Bars are at most about a quarter of the chart wide, and the group of bars is centered,
    // so variables with only one or two values don't fill the whole chart with one wide bar
    const binW = Math.min((plotW - gap * (nb - 1)) / nb, plotW * 0.25);
    const groupW = nb * binW + (nb - 1) * gap;
    const startX = plotLeft + (plotW - groupW) / 2;
    const mSize = isExp ? 9 : 8;
    const perRow = Math.max(1, Math.floor((binW + 2) / (mSize + 2)));
    const maxRows = Math.max(0, ...markerBins.map((m) => Math.ceil(m.length / perRow)));
    const axisLabelH = isExp ? 18 : 16; // x-axis title (column name and unit) under the value labels
    const labelH = (isExp ? 18 : 16) + axisLabelH;
    const top = maxRows * (mSize + 2) + 8;
    const barsBottom = H - labelH;
    const barsH = barsBottom - top;
    const yOf = (c) => barsBottom - (c / yMax) * barsH;
    const labelSize = isExp ? 10 : 9;
    const labelFont = labelSize + "px 'Cascadia Code', ui-monospace, monospace";
    const fitLabel = (text) => {
      if (textWidth(text, labelFont) <= binW) return text;
      let cut = text.length;
      while (cut > 1 && textWidth(text.slice(0, cut) + "…", labelFont) > binW) cut--;
      return text.slice(0, cut) + "…";
    };
    return (
      <svg data-export={exportKey} width={W} height={H} viewBox={`0 0 ${W} ${H}`} style={{ display: "block", overflow: "visible" }}>
        {/* Count scale and faint grid lines */}
        {ticks.map((t) => (
          <g key={"t" + t}>
            <line x1={plotLeft} x2={W} y1={yOf(t)} y2={yOf(t)} stroke={t === 0 ? "#C9C9C5" : "#E4E4E2"} strokeWidth="1" />
            <text x={plotLeft - 6} y={yOf(t) + 3} textAnchor="end" fontSize={isExp ? 10 : 9} fill={MUTED} className="mono">{fmtNum(t)}</text>
          </g>
        ))}
        <text x={titleSize - 1} y={(top + barsBottom) / 2} textAnchor="middle" fontSize={titleSize} fill={MUTED} transform={`rotate(-90 ${titleSize - 1} ${(top + barsBottom) / 2})`}>Number of solutions</text>
        {(() => {
          const xTitle = labelFor(v);
          const xFont = titleSize + "px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif";
          let shown = xTitle;
          if (textWidth(shown, xFont) > plotW) {
            let cut = shown.length;
            while (cut > 1 && textWidth(shown.slice(0, cut) + "…", xFont) > plotW) cut--;
            shown = shown.slice(0, cut) + "…";
          }
          return <text x={plotLeft + plotW / 2} y={H - 3} textAnchor="middle" fontSize={titleSize} fill={MUTED}><title>{xTitle}</title>{shown}</text>;
        })()}
        {bins.map((b, i) => {
          const x = startX + i * (binW + gap);
          const h = counts[i] > 0 ? Math.max(2, (counts[i] / yMax) * barsH) : 0;
          const barTop = barsBottom - h;
          return (
            <g key={i}>
              <rect x={x} y={barTop} width={binW} height={h} fill="#C7C7C3" rx="2"><title>{`${b.full || b.label}: ${counts[i]} of ${results.length} solutions`}</title></rect>
              {markerBins[i].map((m, k) => {
                const row = Math.floor(k / perRow);
                const inRow = Math.min(perRow, markerBins[i].length - row * perRow);
                const col = k % perRow;
                const rowW = inRow * mSize + (inRow - 1) * 2;
                const mx = x + (binW - rowW) / 2 + col * (mSize + 2);
                const my = barTop - 3 - (row + 1) * (mSize + 2) + 2;
                return m.shape === "square"
                  ? <rect key={k} x={mx} y={my} width={mSize} height={mSize} rx="2" fill={m.color}><title>{m.title}</title></rect>
                  : <circle key={k} cx={mx + mSize / 2} cy={my + mSize / 2} r={mSize / 2 - 0.5} fill={m.color}><title>{m.title}</title></circle>;
              })}
              <text x={x + binW / 2} y={H - 3 - axisLabelH} textAnchor="middle" fontSize={labelSize} fill={MUTED} className="mono"><title>{b.full || b.label}</title>{fitLabel(b.label)}</text>
            </g>
          );
        })}
      </svg>
    );
  }

  // ---------- Scenario comparison table downloads ----------
  function scenarioTableRows() {
    const info = scenarios.map((sc) => {
      const res = computeResultsForWeights(sc.weights) || [];
      const winner = res[0] || null;
      const ties = winner ? res.filter((r) => Math.abs(r.score - winner.score) < 1e-9).length - 1 : 0;
      return { sc, winner, ties };
    });
    return info.map((row, idx) => {
      const earlier = row.winner ? info.slice(0, idx).find((o) => o.winner && o.winner.rowNum === row.winner.rowNum) : null;
      return { ...row, sameAs: earlier ? earlier.sc.name : "" };
    });
  }

  // Excel: always every column (weights, winner, notes, all variables), exact values
  function exportScenarioExcel() {
    try {
      const rows = scenarioTableRows();
      const nObj = objectives.length;
      const header1 = ["Scenario", ...objectives.map((_, i) => (i === 0 ? "Weights (%)" : "")), "Winning solution", ...Array(nObj + 2 + variables.length).fill("")];
      const header2 = ["", ...objectives.map(labelFor), "Solution #", ...objectives.map(labelFor), "Same as", "Tied with (other solutions)", ...variables.map(labelFor)];
      const body = rows.map((r) => [
        r.sc.name,
        ...objectives.map((o) => Number(r.sc.weights[o] || 0)),
        r.winner ? r.winner.rowNum : "",
        ...objectives.map((o) => (r.winner ? Number(r.winner.row[o]) : "")),
        r.sameAs,
        r.winner ? r.ties : "",
        ...variables.map((v) => {
          if (!r.winner) return "";
          const val = r.winner.row[v];
          const num = Number(val);
          return val !== null && val !== "" && Number.isFinite(num) ? num : (val ?? "");
        }),
      ]);
      const ws = XLSX.utils.aoa_to_sheet([header1, header2, ...body]);
      const winStart = 1 + nObj;
      const winEnd = winStart + nObj + 2 + variables.length;
      ws["!merges"] = [
        { s: { r: 0, c: 0 }, e: { r: 1, c: 0 } },
        ...(nObj > 1 ? [{ s: { r: 0, c: 1 }, e: { r: 0, c: nObj } }] : []),
        { s: { r: 0, c: winStart }, e: { r: 0, c: winEnd } },
      ];
      // One decimal for weights
      body.forEach((_, ri) => {
        objectives.forEach((_, ci) => {
          const ref = XLSX.utils.encode_cell({ r: ri + 2, c: 1 + ci });
          if (ws[ref]) ws[ref].z = "0.0";
        });
      });
      ws["!cols"] = header2.map((h, i) => ({ wch: Math.max(10, String(i === 0 ? "Scenario" : h).length + 2, ...(i === 0 ? rows.map((r) => r.sc.name.length + 2) : [])) }));
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Scenario comparison");
      XLSX.writeFile(wb, "scenario_comparison.xlsx");
    } catch (e) {
      setExportError("Sorry, the Excel file couldn't be created. Please try again.");
    }
  }

  // Ranked solutions: every design with its rank, score, objectives and all variables, plus a sheet with the weights used
  function exportRankedExcel() {
    try {
      if (!results) return;
      const header = ["Rank", "Score", "Solution #", ...objectives.map(labelFor), ...variables.map(labelFor)];
      const body = results.map((r) => [
        r.rank,
        r.score,
        r.rowNum,
        ...objectives.map((o) => Number(r.row[o])),
        ...variables.map((v) => {
          const val = r.row[v];
          const num = Number(val);
          return val !== null && val !== "" && Number.isFinite(num) ? num : (val ?? "");
        }),
      ]);
      const ws = XLSX.utils.aoa_to_sheet([header, ...body]);
      body.forEach((_, ri) => {
        const ref = XLSX.utils.encode_cell({ r: ri + 1, c: 1 });
        if (ws[ref]) ws[ref].z = "0.000";
      });
      ws["!cols"] = header.map((h) => ({ wch: Math.max(9, String(h).length + 2) }));
      // Second sheet: the weights and directions these rankings were calculated with
      const wsum = objectives.reduce((sum, o) => sum + (weights[o] || 0), 0) || 1;
      const ws2 = XLSX.utils.aoa_to_sheet([
        ["Objective", "Direction", "Weight (%)"],
        ...objectives.map((o) => [labelFor(o), roles[o] === "max" ? "Higher is better" : "Lower is better", ((weights[o] || 0) / wsum) * 100]),
      ]);
      objectives.forEach((_, i) => {
        const ref = XLSX.utils.encode_cell({ r: i + 1, c: 2 });
        if (ws2[ref]) ws2[ref].z = "0.0";
      });
      ws2["!cols"] = [{ wch: Math.max(12, ...objectives.map((o) => labelFor(o).length + 2)) }, { wch: 18 }, { wch: 12 }];
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Ranked solutions");
      XLSX.utils.book_append_sheet(wb, ws2, "Weights used");
      XLSX.writeFile(wb, "ranked_solutions.xlsx");
    } catch (e) {
      setExportError("Sorry, the Excel file couldn't be created. Please try again.");
    }
  }

  // Image: drawn as SVG, looks like the on-screen table; follows the "Show variables" checkbox
  const TABLE_MONO = "'Cascadia Code', ui-monospace, monospace";
  const TABLE_SANS = "-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif";
  function scenarioTableLayout() {
    const rows = scenarioTableRows();
    const vars = showVars ? variables : [];
    const ctx = document.createElement("canvas").getContext("2d");
    const measure = (text, font) => { ctx.font = font; return ctx.measureText(String(text)).width; };
    const cellFont = `11px ${TABLE_MONO}`;
    const headFont = `600 11px ${TABLE_MONO}`;
    const nameFont = `600 11px ${TABLE_SANS}`;
    const noteFont = `600 9px ${TABLE_MONO}`;
    const padX = 8;
    const cols = [];
    cols.push({ kind: "name", head: "Scenario", w: Math.max(measure("Scenario", headFont), ...rows.map((r) => 16 + measure(r.sc.name, nameFont))) + padX * 2 });
    objectives.forEach((o) => cols.push({ kind: "weight", o, head: labelFor(o), w: Math.max(measure(labelFor(o), headFont), ...rows.map((r) => measure(fmtWeight(r.sc.weights[o] || 0) + "%", cellFont))) + padX * 2 }));
    cols.push({ kind: "design", head: "Solution #", w: Math.max(measure("Solution #", headFont), ...rows.map((r) => Math.max(
      measure(r.winner ? r.winner.rowNum : "–", cellFont),
      r.sameAs ? measure("same as " + r.sameAs, noteFont) : 0,
      r.ties > 0 ? measure(`tied with ${r.ties} others`, noteFont) : 0,
    ))) + padX * 2 });
    objectives.forEach((o) => cols.push({ kind: "value", o, head: labelFor(o), w: Math.max(measure(labelFor(o), headFont), ...rows.map((r) => measure(r.winner ? fmtNum(Number(r.winner.row[o])) : "–", cellFont))) + padX * 2 }));
    vars.forEach((v) => cols.push({ kind: "var", v, head: labelFor(v), w: Math.max(measure(labelFor(v), headFont), ...rows.map((r) => measure(r.winner ? fmtNum(r.winner.row[v]) : "–", cellFont))) + padX * 2 }));
    const totalW = cols.reduce((sum, c) => sum + c.w, 0);
    return { rows, cols, totalW, padX };
  }

  async function exportScenarioTableImage(format) {
    setExportError("");
    try {
      const { rows, cols, totalW, padX } = scenarioTableLayout();
      const NS = "http://www.w3.org/2000/svg";
      const headH1 = 22, headH2 = 24;
      const rowHeights = rows.map((r) => 24 + (r.sameAs ? 11 : 0) + (r.ties > 0 ? 11 : 0));
      const H = headH1 + headH2 + rowHeights.reduce((a, b) => a + b, 0);
      const svg = document.createElementNS(NS, "svg");
      svg.setAttribute("width", totalW); svg.setAttribute("height", H); svg.setAttribute("viewBox", `0 0 ${totalW} ${H}`);
      const add = (tag, attrs, text) => {
        const el = document.createElementNS(NS, tag);
        Object.entries(attrs).forEach(([k, v]) => el.setAttribute(k, v));
        if (text !== undefined) el.textContent = text;
        svg.appendChild(el);
        return el;
      };
      const headBg = "#E6E6E2", weightBg = "#F2F2EF";
      add("rect", { x: 0, y: 0, width: totalW, height: headH1 + headH2, fill: headBg });
      // Column x positions
      let x = 0;
      cols.forEach((c) => { c.x = x; x += c.w; });
      const wCols = cols.filter((c) => c.kind === "weight");
      const winCols = cols.filter((c) => c.kind === "design" || c.kind === "value" || c.kind === "var");
      const groupLabel = (label, list) => {
        if (!list.length) return;
        const x0 = list[0].x, x1 = list[list.length - 1].x + list[list.length - 1].w;
        add("text", { x: (x0 + x1) / 2, y: 15, "text-anchor": "middle", "font-size": 9.5, "letter-spacing": "0.5", fill: MUTED, "font-family": TABLE_MONO }, label);
        add("line", { x1: x0 + 4, x2: x1 - 4, y1: headH1 - 1, y2: headH1 - 1, stroke: BORDER, "stroke-width": 1 });
      };
      groupLabel("WEIGHTS", wCols);
      groupLabel("WINNING SOLUTION", winCols);
      cols.forEach((c) => {
        const isName = c.kind === "name";
        add("text", {
          x: isName ? c.x + padX : c.x + c.w - padX, y: headH1 + 16, "text-anchor": isName ? "start" : "end",
          "font-size": 11, "font-weight": 600, fill: isName ? MUTED : TEXT, "font-family": isName ? TABLE_SANS : TABLE_MONO,
        }, c.head);
      });
      let y = headH1 + headH2;
      rows.forEach((r, ri) => {
        const h = rowHeights[ri];
        wCols.forEach((c) => add("rect", { x: c.x, y, width: c.w, height: h, fill: weightBg }));
        add("line", { x1: 0, x2: totalW, y1: y, y2: y, stroke: BORDER, "stroke-width": 1 });
        const baseY = y + 16;
        cols.forEach((c) => {
          if (c.kind === "name") {
            add("rect", { x: c.x + padX, y: baseY - 9, width: 10, height: 10, rx: 3, fill: r.sc.color });
            add("text", { x: c.x + padX + 16, y: baseY, "font-size": 11, "font-weight": 600, fill: TEXT, "font-family": TABLE_SANS }, r.sc.name);
            return;
          }
          let text = "–";
          if (c.kind === "weight") text = fmtWeight(r.sc.weights[c.o] || 0) + "%";
          else if (r.winner && c.kind === "design") text = String(r.winner.rowNum);
          else if (r.winner && c.kind === "value") text = fmtNum(Number(r.winner.row[c.o]));
          else if (r.winner && c.kind === "var") text = fmtNum(r.winner.row[c.v]);
          add("text", { x: c.x + c.w - padX, y: baseY, "text-anchor": "end", "font-size": 11, fill: TEXT, "font-family": TABLE_MONO }, text);
          if (c.kind === "design") {
            let ny = baseY;
            if (r.sameAs) { ny += 11; add("text", { x: c.x + c.w - padX, y: ny, "text-anchor": "end", "font-size": 9, "font-weight": 600, fill: EMERALD_DARK, "font-family": TABLE_MONO }, "same as " + r.sameAs); }
            if (r.ties > 0) { ny += 11; add("text", { x: c.x + c.w - padX, y: ny, "text-anchor": "end", "font-size": 9, "font-weight": 600, fill: "#A15C00", "font-family": TABLE_MONO }, `tied with ${r.ties} other${r.ties === 1 ? "" : "s"}`); }
          }
        });
        y += h;
      });
      add("rect", { x: 0.5, y: 0.5, width: totalW - 1, height: H - 1, fill: "none", stroke: BORDER, "stroke-width": 1, rx: 6 });
      // Put it off-screen so it can be measured, then save it like the charts
      const holder = document.createElement("div");
      holder.style.cssText = "position:absolute;left:-10000px;top:0;visibility:hidden;";
      holder.appendChild(svg);
      document.body.appendChild(holder);
      await exportSvgElement(svg, { filename: "scenario_comparison", title: "Scenario comparison" }, format);
      holder.remove();
    } catch (e) {
      setExportError("Sorry, the table image couldn't be created. Please try again, or try the other format.");
    }
  }

  // Splits a column name into its name and unit, e.g. "Net present cost (CAD)" -> { name: "Net present cost", unit: "CAD" }.
  // Only parentheses at the very end count as a unit; names without them have no unit.
  function splitUnit(label) {
    const m = String(label).match(/^(.*\S)\s*\(([^()]+)\)\s*$/);
    return m ? { name: m[1], unit: m[2] } : { name: String(label), unit: "" };
  }

                                const markerBins = bins.map(() => []);
                                winnerLines.forEach((l) => {
                                  const idx = bins.findIndex((b) => b.test(Number(l.result.row[v])));
                                  if (idx >= 0) l.scens.forEach((sc) => {
                                    const t = tiesFor(sc);
                                    markerBins[idx].push({ color: sc.color, shape: "square", title: `${sc.name}'s winner (solution ${l.result.rowNum}): ${fmtNum(l.result.row[v])}${t > 0 ? ` · tied with ${t} other${t === 1 ? "" : "s"}` : ""}` });
                                  });
                                });
                                return (
                                  <div key={v} style={{ background: PANEL, border: `1px solid ${BORDER}`, borderRadius: 8, padding: "12px 12px 10px" }}>
                                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 6, marginBottom: 10 }}>
                                      <div style={{ fontSize: 12, fontWeight: 700, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }} title={labelFor(v)}>{labelFor(v)}</div>
                                      {dlButtons("scen-hist-" + v, {
                                        filename: "scenario_winners_histogram_" + labelFor(v),
                                        title: labelFor(v),
                                        legend: scenarios.map((sc) => ({ color: sc.color, label: sc.name })),
                                      })}
                                    </div>
                                    <MeasuredWidth>{(w) => renderHistSvg("scen-hist-" + v, v, markerBins, w)}</MeasuredWidth>
                                  </div>
                                );
                              })}
                            </div>
                            <div style={{ fontSize: 11, color: MUTED, marginTop: 10, lineHeight: 1.5 }}>
                              Each bar shows how many of your {results.length} solutions share that value (or fall in that range). The colored squares above a bar mark where each scenario's winning solution lands (see the comparison table above for which color is which scenario). Hover over a square for the scenario, solution number and any ties, or over a bar for its exact count.
                            </div>
                          </div>
                        );
                      })()}
                    </>
                  )}
                </div>
              )}


              {chartView !== "scenarios" && (
              <>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8, marginTop: 28 }}>
                <div style={{ fontSize: 13, fontWeight: 700 }}>Ranked solutions ({results.length})</div>
                <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
                  {variables.length > 0 && (
                    <label style={{ fontSize: 12, color: MUTED, display: "flex", alignItems: "center", gap: 6, cursor: "pointer" }}>
                      <input type="checkbox" checked={showVars} onChange={(e) => setShowVars(e.target.checked)} />
                      Show design parameters
                    </label>
                  )}
                  <button
                    onClick={exportRankedExcel}
                    title="Download every solution with its rank, score, objectives and all design parameters, plus the weights used"
                    style={{ fontSize: 10, fontWeight: 600, color: MUTED, background: "#fff", border: `1px solid ${BORDER}`, borderRadius: 4, padding: "1px 6px", cursor: "pointer", lineHeight: 1.5 }}
                  >↓ Excel</button>
                </div>
              </div>
              <div style={{ border: `1px solid ${BORDER}`, borderRadius: 8, overflow: "auto", maxHeight: 480 }}>
                <table>
                  <thead>
                    <tr>
                      <th>Rank</th>
                      <th>Score</th>
                      {objectives.map((o) => <th key={o}>{labelFor(o)}</th>)}
                      {showVars && variables.map((v) => <th key={v}>{labelFor(v)}</th>)}
                    </tr>
                  </thead>
                  <tbody>
                    {results.map((r) => (
                      <tr key={r.rank} style={{ background: r.rank <= topN ? "rgba(11,110,79,0.04)" : "transparent" }}>
                        <td>
                          {r.rank <= topN ? (
                            <span className="mono" style={{
                              display: "inline-flex", alignItems: "center", justifyContent: "center",
                              width: 24, height: 24, borderRadius: "50%", background: rankColor(r.rank),
                              color: "#fff", fontWeight: 700, fontSize: 12,
                            }}>{r.rank}</span>
                          ) : (
                            <span style={{ paddingLeft: 3 }}>{r.rank}</span>
                          )}
                        </td>
                        <td>{r.score.toFixed(3)}</td>
                        {objectives.map((o) => <td key={o}>{fmtNum(Number(r.row[o]))}</td>)}
                        {showVars && variables.map((v) => <td key={v}>{fmtNum(r.row[v])}</td>)}
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
              </>
              )}
            </>
          )}
        </div>
      </div>
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<ParetoRanker />);
</script>
</body>
</html>
